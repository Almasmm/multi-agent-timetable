# Local run of the web platform from the Docker image:
#   docker compose up -d --build      ->  http://localhost:8000
# Run results and uploaded workbooks live in named volumes and survive container rebuilds.
# LLM keys are optional: put them into .env (git-ignored); without keys the system uses offline rules.
services:
  timetable:
    build:
      context: .
      target: runtime
    image: multi-agent-timetable:local
    container_name: timetable
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TT_SOLVER_WORKERS: "8"
    volumes:
      - timetable-runs:/app/runs
      - timetable-uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  timetable-runs:
  timetable-uploads:
