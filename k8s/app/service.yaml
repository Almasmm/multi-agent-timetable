# NodePort: the UI is reachable at http://<minikube ip>:30080 (or `minikube service timetable -n timetable`).
apiVersion: v1
kind: Service
metadata:
  name: timetable
  labels:
    app.kubernetes.io/name: timetable
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: timetable
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
