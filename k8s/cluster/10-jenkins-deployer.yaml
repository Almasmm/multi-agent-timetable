# Identity of the Jenkins CD stage: may manage the application objects in namespace "timetable" only
# (no cluster-wide rights, no access to Secrets).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: timetable
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: timetable
  annotations:
    kubernetes.io/service-account.name: jenkins-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: timetable-deployer
  namespace: timetable
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: timetable
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: timetable
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: timetable-deployer
